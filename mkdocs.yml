# Aknowledge-base — MkDocs 配置
# 参考: https://squidfunk.github.io/mkdocs-material/

site_name: Aknowledge-base
site_description: 面向 AI 应用方向的计算机知识库

theme:
  name: material
  language: zh
  icon:
    logo: material/library
  features:
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search

nav:
  - 首页: index.md
  - 知识地图 (00-Index): 00-Index/index.md
  - Python (01):
      - 板块索引: 01-Python/index.md
      - 语言特性:
          - 装饰器（示例）: 01-Python/Language-Features/Decorators.md
  - 机器学习算法 (02): 02-ML-Algorithms/index.md
  - 深度学习 (03): 03-DeepLearning/index.md
  - NLP 与 LLM (04): 04-NLP-LLM/index.md
  - 计算机视觉 (05): 05-CV/index.md
  - AI Agents (06): 06-AI-Agents/index.md
  - MLOps 与部署 (07): 07-MLOps-Deployment/index.md
  - 算法与数据结构 (08): 08-Algorithms-DSA/index.md
  - 计算机基础 (09): 09-CS-Foundation/index.md
  - 踩坑记录 (10): 10-Debug-Log/index.md

markdown_extensions:
  # Python Markdown 内置扩展
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  # PyMdown Extensions
  - pymdownx.arithmatex:              # 数学公式 (MathJax)
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:             # Mermaid 图
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 模板文件不参与站点构建
exclude_docs: |
  _template.md
